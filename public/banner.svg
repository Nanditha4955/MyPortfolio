<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Great+Vibes&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .cursive-title {
        font-family: 'Great Vibes', 'Caveat', 'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive, sans-serif;
      }
      .sans-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>

    <!-- Deep Space Gradient Background -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="35%" stop-color="#080720"/>
      <stop offset="70%" stop-color="#14092b"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>

    <!-- Aurora Ribbon Gradients -->
    <linearGradient id="auroraGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="auroraGlow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="megaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="380" rx="24" fill="url(#spaceBg)"/>

  <!-- Ambient Nebulae -->
  <circle cx="180" cy="120" r="160" fill="#7928ca" opacity="0.3" filter="url(#megaGlow)"/>
  <circle cx="980" cy="190" r="180" fill="#00f2fe" opacity="0.22" filter="url(#megaGlow)"/>
  <circle cx="580" cy="320" r="190" fill="#3b82f6" opacity="0.2" filter="url(#megaGlow)"/>

  <!-- Curved Aurora Ribbons (Top & Bottom Wave Flow) -->
  <path d="M -60 300 C 180 340, 360 210, 620 250 C 880 290, 1020 170, 1260 210" 
        fill="none" stroke="url(#auroraGlow1)" stroke-width="5" filter="url(#softGlow)"/>
  <path d="M -60 330 C 220 230, 420 360, 720 280 C 970 220, 1080 320, 1260 250" 
        fill="none" stroke="url(#auroraGlow2)" stroke-width="3" opacity="0.85"/>
  <path d="M -40 100 C 280 20, 480 160, 780 80 C 980 20, 1140 120, 1260 60" 
        fill="none" stroke="url(#auroraGlow1)" stroke-width="2" opacity="0.45"/>

  <!-- Starlight Tech Particles -->
  <circle cx="90" cy="70" r="3.5" fill="#38bdf8" opacity="0.85"/>
  <circle cx="510" cy="50" r="2.5" fill="#a855f7" opacity="0.75"/>
  <circle cx="450" cy="320" r="3.5" fill="#00f2fe" opacity="0.65"/>
  <circle cx="1110" cy="80" r="4" fill="#818cf8" opacity="0.8"/>
  <circle cx="760" cy="330" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="280" cy="350" r="2" fill="#c084fc" opacity="0.5"/>

  <!-- Branding Group: Left / Center -->
  <g transform="translate(90, 95)">
    <!-- Neon Code Symbol Box </> -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="62" height="62" rx="16" fill="#0b0a24" stroke="url(#cyanPurple)" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M 23 21 L 14 31 L 23 41" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 39 21 L 48 31 L 39 41" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="34" y1="19" x2="28" y2="43" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Name Heading (Cursive Script with Glow) -->
    <text x="85" y="52" class="cursive-title" font-size="64" font-weight="700" fill="url(#titleGlow)" filter="url(#softGlow)" letter-spacing="1">
      Nanditha M
    </text>

    <!-- Title / Subtitle -->
    <text x="85" y="100" class="sans-text" font-size="25" font-weight="600" fill="url(#cyanPurple)" letter-spacing="0.5">
      Aspiring Full Stack Developer
    </text>

    <!-- Three Tagline Pillars: BUILD • LEARN • INNOVATE -->
    <g transform="translate(85, 142)">
      <text x="0" y="0" class="sans-text" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing="3.5">
        BUILD
      </text>
      <circle cx="78" cy="-5" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="98" y="0" class="sans-text" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing="3.5">
        LEARN
      </text>
      <circle cx="186" cy="-5" r="3.5" fill="#a855f7" filter="url(#softGlow)"/>
      <text x="206" y="0" class="sans-text" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing="3.5">
        INNOVATE
      </text>
    </g>
  </g>

  <!-- Right Section: Quote & 3D Glowing Code Laptop -->
  <g transform="translate(830, 80)">
    <!-- Handwritten Quote on Upper Right -->
    <g transform="translate(-15, 25)">
      <text x="0" y="0" class="cursive-title" font-size="28" fill="#c084fc" filter="url(#softGlow)">
        “Turning Ideas
      </text>
      <text x="45" y="36" class="cursive-title" font-size="28" fill="#38bdf8" filter="url(#softGlow)">
        into Impact”
      </text>
    </g>

    <!-- Futuristic 3D Perspective Glowing Laptop -->
    <g transform="translate(30, 75)">
      <!-- Ground Ambient Cyan Base Glow -->
      <ellipse cx="130" cy="165" rx="145" ry="24" fill="#00f2fe" opacity="0.22" filter="url(#megaGlow)"/>

      <!-- Laptop Screen Chassis -->
      <polygon points="40,15 185,-5 240,120 95,140" fill="#0b0b24" stroke="#818cf8" stroke-width="2"/>
      
      <!-- Screen Display (Deep Electric Indigo) -->
      <polygon points="47,19 179,-1 231,116 99,134" fill="#06081e"/>
      
      <!-- Syntax Highlighted Code Lines -->
      <line x1="68" y1="32" x2="115" y2="26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="75" y1="46" x2="148" y2="37" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="82" y1="60" x2="132" y2="53" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="89" y1="74" x2="168" y2="64" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="96" y1="88" x2="140" y2="82" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="104" y1="102" x2="184" y2="93" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="112" y1="116" x2="158" y2="110" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

      <!-- Laptop Base Deck & Keyboard Deck -->
      <polygon points="95,140 240,120 282,152 126,174" fill="#18163f" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="126,174 282,152 282,158 126,180" fill="#0b0a24"/>

      <!-- Glowing Trackpad -->
      <polygon points="175,152 225,145 233,155 183,162" fill="#06081e" stroke="#818cf8" stroke-width="1"/>

      <!-- Floating Holographic Tech Cube -->
      <g transform="translate(15, 88)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#0b0a24" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" filter="url(#softGlow)"/>
        <circle cx="15" cy="15" r="6" fill="none" stroke="#c084fc" stroke-width="1.8"/>
        <circle cx="15" cy="15" r="2.5" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
