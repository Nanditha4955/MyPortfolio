<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#07172b"/>
    </linearGradient>
    <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#cBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#08182b" stroke="#38bdf8" stroke-width="1.5" filter="url(#cGlow)"/>
    <rect x="23" y="27" width="30" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.3"/>
    <path d="M 23 29 L 38 40 L 53 29" fill="none" stroke="#38bdf8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="40" r="2.2" fill="#67e8f9"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Get In Touch
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      Open for full-stack developer roles
    </text>
    <g transform="translate(0, 36)">
      <rect width="118" height="22" rx="11" fill="#0369a1" opacity="0.25"/>
      <rect width="118" height="22" rx="11" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#38bdf8">
        SEND EMAIL ↗
      </text>
    </g>
  </g>
</svg>