<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#1c1206"/>
    </linearGradient>
    <filter id="eGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#eBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#1f1304" stroke="#f59e0b" stroke-width="1.5" filter="url(#eGlow)"/>
    <path d="M 38 22 L 57 31 L 38 40 L 19 31 Z" fill="none" stroke="#f59e0b" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M 26 34 L 26 48 C 26 52, 38 56, 38 56 C 38 56, 50 52, 50 48 L 50 34" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="54" y1="32" x2="54" y2="45" stroke="#fbbf24" stroke-width="1.8"/>
    <circle cx="54" cy="46" r="1.8" fill="#fbbf24"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Experience
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      INDBIN CRM • B.Tech CSE 2026
    </text>
    <g transform="translate(0, 36)">
      <rect width="118" height="22" rx="11" fill="#78350f" opacity="0.25"/>
      <rect width="118" height="22" rx="11" fill="none" stroke="#f59e0b" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#fbbf24">
        VIEW JOURNEY ↗
      </text>
    </g>
  </g>
</svg>