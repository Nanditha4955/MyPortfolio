<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#0e122b"/>
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Container -->
  <rect x="2" y="2" width="576" height="136" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="2" y="2" width="576" height="136" rx="20" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle -->
  <g transform="translate(24, 30)">
    <rect width="80" height="80" rx="20" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Globe / Website Icon -->
    <circle cx="40" cy="40" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <ellipse cx="40" cy="40" rx="10" ry="22" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="18" y1="40" x2="62" y2="40" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="40" cy="40" r="4" fill="#67e8f9"/>
  </g>

  <!-- Content -->
  <g transform="translate(122, 45)">
    <text class="sans" x="0" y="0" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.3">
      Live Portfolio Website
    </text>
    <text class="sans" x="0" y="26" font-size="13" font-weight="400" fill="#94a3b8">
      Explore interactive web builds, clean UI & live demos
    </text>
    <g transform="translate(0, 48)">
      <rect width="130" height="24" rx="12" fill="#0369a1" opacity="0.25"/>
      <rect width="130" height="24" rx="12" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <text class="sans" x="14" y="16" font-size="11" font-weight="600" fill="#38bdf8">
        VIEW PORTFOLIO ↗
      </text>
    </g>
  </g>
</svg>
