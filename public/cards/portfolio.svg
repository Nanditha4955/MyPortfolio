<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#0c122e"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#pBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#091428" stroke="#38bdf8" stroke-width="1.5" filter="url(#pGlow)"/>
    <circle cx="38" cy="38" r="21" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <ellipse cx="38" cy="38" rx="9" ry="21" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="17" y1="38" x2="59" y2="38" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="38" cy="38" r="3.5" fill="#67e8f9"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Live Portfolio
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      Explore interactive builds &amp; UI
    </text>
    <g transform="translate(0, 36)">
      <rect width="118" height="22" rx="11" fill="#0284c7" opacity="0.25"/>
      <rect width="118" height="22" rx="11" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#38bdf8">
        VIEW LIVE DEMO ↗
      </text>
    </g>
  </g>
</svg>