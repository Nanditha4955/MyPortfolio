<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#140f2e"/>
    </linearGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#prBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#120e30" stroke="#818cf8" stroke-width="1.5" filter="url(#prGlow)"/>
    <path d="M 23 28 L 34 28 L 40 34 L 53 34 L 53 53 L 23 53 Z" fill="none" stroke="#818cf8" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M 31 41 L 36 46 L 31 51" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="39" y1="51" x2="45" y2="51" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Expense Tracker
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      Full-stack finance app &amp; analytics
    </text>
    <g transform="translate(0, 36)">
      <rect width="118" height="22" rx="11" fill="#4338ca" opacity="0.25"/>
      <rect width="118" height="22" rx="11" fill="none" stroke="#818cf8" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#a5b4fc">
        GITHUB REPO ↗
      </text>
    </g>
  </g>
</svg>