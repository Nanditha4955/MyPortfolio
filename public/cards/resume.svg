<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#0a1820"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Container -->
  <rect x="2" y="2" width="576" height="136" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="2" y="2" width="576" height="136" rx="20" fill="none" stroke="#34d399" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle -->
  <g transform="translate(24, 30)">
    <rect width="80" height="80" rx="20" fill="#061c16" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Document / Check Icon -->
    <path d="M 28 22 L 46 22 L 54 30 L 54 58 L 28 58 Z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 46 22 L 46 30 L 54 30" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="34" y1="38" x2="48" y2="38" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="46" x2="44" y2="46" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="52" r="2.5" fill="#6ee7b7"/>
  </g>

  <!-- Content -->
  <g transform="translate(122, 45)">
    <text class="sans" x="0" y="0" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.3">
      Official Resume &amp; CV
    </text>
    <text class="sans" x="0" y="26" font-size="13" font-weight="400" fill="#94a3b8">
      Verified credentials, B.Tech CS (CGPA 7.53) &amp; CRM internship
    </text>
    <g transform="translate(0, 48)">
      <rect width="145" height="24" rx="12" fill="#065f46" opacity="0.25"/>
      <rect width="145" height="24" rx="12" fill="none" stroke="#34d399" stroke-width="1"/>
      <text class="sans" x="14" y="16" font-size="11" font-weight="600" fill="#34d399">
        VIEW OFFICIAL PDF ↗
      </text>
    </g>
  </g>
</svg>
