<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#091a18"/>
    </linearGradient>
    <filter id="rGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#rBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#34d399" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#061c16" stroke="#34d399" stroke-width="1.5" filter="url(#rGlow)"/>
    <path d="M 27 21 L 43 21 L 51 29 L 51 55 L 27 55 Z" fill="none" stroke="#34d399" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M 43 21 L 43 29 L 51 29" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <line x1="33" y1="36" x2="45" y2="36" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="33" y1="44" x2="42" y2="44" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="33" cy="49" r="2" fill="#6ee7b7"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Official Resume
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      B.Tech CS &amp; CRM Internship
    </text>
    <g transform="translate(0, 36)">
      <rect width="128" height="22" rx="11" fill="#065f46" opacity="0.25"/>
      <rect width="128" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#34d399">
        VIEW RESUME PDF ↗
      </text>
    </g>
  </g>
</svg>