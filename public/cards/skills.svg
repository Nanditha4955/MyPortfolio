<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#180e28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Container -->
  <rect x="2" y="2" width="576" height="136" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="2" y="2" width="576" height="136" rx="20" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle -->
  <g transform="translate(24, 30)">
    <rect width="80" height="80" rx="20" fill="#180b2a" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
    <!-- CPU / Tech Icon -->
    <rect x="28" y="28" width="24" height="24" rx="5" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="4" fill="#e879f9"/>
    <line x1="40" y1="20" x2="40" y2="28" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="52" x2="40" y2="60" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="28" y2="40" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="40" x2="60" y2="40" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Content -->
  <g transform="translate(122, 45)">
    <text class="sans" x="0" y="0" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.3">
      Technical Stack &amp; Skills
    </text>
    <text class="sans" x="0" y="26" font-size="13" font-weight="400" fill="#94a3b8">
      React JS, Node.js, PHP, MySQL, JavaScript, Tailwind, REST APIs
    </text>
    <g transform="translate(0, 48)">
      <rect width="135" height="24" rx="12" fill="#701a75" opacity="0.25"/>
      <rect width="135" height="24" rx="12" fill="none" stroke="#c084fc" stroke-width="1"/>
      <text class="sans" x="14" y="16" font-size="11" font-weight="600" fill="#e879f9">
        EXPLORE SKILLS ↗
      </text>
    </g>
  </g>
</svg>
