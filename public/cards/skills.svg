<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070719"/>
      <stop offset="100%" stop-color="#180e2b"/>
    </linearGradient>
    <filter id="sGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="376" height="126" rx="18" fill="url(#sBg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="376" height="126" rx="18" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.35"/>

  <!-- Left Icon Circle/Squircle -->
  <g transform="translate(18, 25)">
    <rect width="76" height="76" rx="18" fill="#180a2b" stroke="#c084fc" stroke-width="1.5" filter="url(#sGlow)"/>
    <rect x="26" y="26" width="24" height="24" rx="5" fill="none" stroke="#c084fc" stroke-width="2.2"/>
    <circle cx="38" cy="38" r="3.5" fill="#e879f9"/>
    <line x1="38" y1="18" x2="38" y2="26" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="50" x2="38" y2="58" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="38" x2="26" y2="38" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="38" x2="58" y2="38" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card Typography -->
  <g transform="translate(106, 44)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      Technical Skills
    </text>
    <text class="sans" x="0" y="22" font-size="11.5" font-weight="400" fill="#94a3b8">
      React, Node, PHP, MySQL &amp; APIs
    </text>
    <g transform="translate(0, 36)">
      <rect width="118" height="22" rx="11" fill="#701a75" opacity="0.25"/>
      <rect width="118" height="22" rx="11" fill="none" stroke="#c084fc" stroke-width="1"/>
      <text class="sans" x="12" y="15" font-size="10" font-weight="600" fill="#e879f9">
        EXPLORE TECH ↗
      </text>
    </g>
  </g>
</svg>